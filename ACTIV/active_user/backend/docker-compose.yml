services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: activ
      POSTGRES_PASSWORD: activ
      POSTGRES_DB: activ
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - activ-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activ -d activ"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - activ-redis:/data

volumes:
  activ-postgres:
  activ-redis:
